<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>من محمود لأمنية ❤️</title>

/* =========================
   إعدادات عامة
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at top,
            #761d43 0%,
            #32101f 45%,
            #090307 100%
        );

    overflow-x: hidden;
}


/* قلوب خلفية */

body::before {
    content:
        "❤️   ❤️   ❤️   ❤️   ❤️   ❤️   ❤️";

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    font-size: 28px;

    line-height: 90px;

    opacity: 0.06;

    pointer-events: none;

    z-index: -1;
}


/* =========================
   الحاوية
========================= */

.container {

    width: 92%;

    max-width: 700px;

    margin: auto;

    padding:
        30px
        0
        60px;
}


/* =========================
   شاشة الباسورد
========================= */

#login {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;
}


.login-box {

    width: 100%;

    padding:
        40px
        25px;

    text-align: center;

    border-radius: 30px;

    background:
        rgba(255,255,255,0.09);

    backdrop-filter: blur(15px);

    border:
        1px solid
        rgba(255,255,255,0.15);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,0.55);
}


.login-heart {

    font-size: 70px;

    animation:
        heartBeat 1.2s infinite;
}


@keyframes heartBeat {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
    }
}


.login-box h1 {

    margin:
        10px 0;

    font-size: 30px;
}


.login-box p {

    color:
        #ffd5e2;

    font-size: 17px;

    line-height: 1.8;
}


/* خانة الباسورد */

#password {

    width: 100%;

    padding: 16px;

    margin-top: 15px;

    border: none;

    outline: none;

    border-radius: 15px;

    font-size: 20px;

    text-align: center;

    background:
        rgba(255,255,255,0.96);
}


/* زر الدخول */

.login-button {

    width: 100%;

    padding: 16px;

    margin-top: 15px;

    border: none;

    border-radius: 15px;

    font-size: 18px;

    font-weight: bold;

    color: white;

    background:
        linear-gradient(
            135deg,
            #ff5b8a,
            #c9184a
        );

    cursor: pointer;
}


.login-button:active {

    transform: scale(0.98);
}


#error {

    display: none;

    margin-top: 15px;

    color:
        #ff9eb8;

    font-size: 15px;
}


/* =========================
   الصفحة الرئيسية
========================= */

#page {

    display: none;
}


/* =========================
   الهيدر
========================= */

.header {

    text-align: center;

    padding:
        25px
        0
        10px;
}


.main-heart {

    font-size: 65px;

    animation:
        heartBeat 1.2s infinite;
}


.header h1 {

    margin:

    font-size: 36px;
}


.header h2 {

    margin:

    color:
        #ffc4d5;

    font-weight: normal;

    font-size: 21px;
}


.date-badge {

    display: inline-block;

    padding:

    border-radius: 30px;

    background:
        rgba(255,255,255,0.1);

    border:

        rgba(255,255,255,0.15);

    color:
        #ffd4e0;
}


/* =========================
   معرض الصور
========================= */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 14px;

    margin-top: 30px;
}


.gallery img {

    width: 100%;

    height: 260px;

    object-fit: cover;

    border-radius: 22px;

    border:
        2px solid
        rgba(255,255,255,0.16);

    box-shadow:
        0 12px 35px
        rgba(0,0,0,0.45);

    transition:
        transform 0.3s;
}


.gallery img:hover {

    transform:
        scale(1.03);
}


/* الصورة الأولى أكبر */

.gallery img:first-child {

    grid-column:
        span 2;

    height: 360px;
}

========================= */

}

    text-align: center;

    margin-top: 0;

    color:
        #ffabc2;

    font-size: 26px;
}


.letter p {

    text-align: center;

    font-size: 19px;

    line-height: 2.1;

    color:
        #fff3f6;

    margin-bottom: 0;
}


/* =========================
   العداد
========================= */

.counter {

    margin-top: 30px;

    padding:
        28px
        15px;

    border-radius: 27px;

    text-align: center;

    background:
        linear-gradient(
            135deg,
            rgba(255,60,110,0.20),
            rgba(100,10,50,0.30)
        );

    border:
        1px solid
        rgba(255,255,255,0.12);
}


.counter h2 {

    margin-top: 0;

    color:
        #ffc4d5;
}


.counter p {

    color:
        #ffd8e3;

    font-size: 17px;
}


.timer {

    grid-template-columns:

    gap: 8px;

    margin-top: 20px;
}
